# Canonical briefing model for campaign-kit.
# Single source: kit/briefing.py validates and applies this schema, and the markdown
# template is generated from it — the two never diverge. Paths are relative to the briefing file.
versao: 1

secoes:
  marca:
    titulo: "Brand"
    campos:
      nome:
        tipo: texto
        obrigatorio: true
        pergunta: "What is the brand name?"
        porque: "It becomes the brands/ folder id, the signature on pieces and the file naming."
      logo:
        tipo: arquivo
        obrigatorio: true
        pergunta: "Which file is the logo? (PNG with transparent background preferred)"
        porque: "Without a logo there is no derived palette and no signature on the pieces."
      paleta:
        tipo: mapa_hex
        obrigatorio: false
        perguntar_se_ausente: true
        pergunta: "What are the brand colors (primary, accent, ink, paper, dark in #RRGGBB)?"
        porque: "Without a declared palette I derive a proposal from the logo pixels — the designer confirms."
        chaves: [primary, accent, ink, paper, dark]
      fontes:
        tipo: mapa_arquivos
        obrigatorio: false
        perguntar_se_ausente: true
        pergunta: "Which font files are the title (display), the highlight (accent) and the body (text)?"
        porque: "Brand fonts are not inferable from images; without the files I use a system substitute and tell you."
        chaves: [display, accent, text]
      voz.tom:
        tipo: texto
        obrigatorio: true
        pergunta: "What is the brand's tone of voice? (e.g. direct and warm, technical and sober)"
        porque: "Voice comes from the briefing, not from pixels — it guides all generated copy."
      voz.nunca_prometer:
        tipo: lista
        obrigatorio: false
        perguntar_se_ausente: true
        pergunta: "What can the brand never promise in copy? (e.g. job guarantee, cure, financial result)"
        porque: "Copy restrictions are a brand compliance rule, not a renderer decision."
      idiomas:
        tipo: lista
        obrigatorio: false
        padrao: [en]
        pergunta: "Which languages does the campaign run in? (e.g. en, pt-BR, fr-CA)"
        porque: "Defines the copy locale and the language of automatic video transcription."

  campanha:
    titulo: "Campaign"
    campos:
      objetivo:
        tipo: texto
        obrigatorio: true
        pergunta: "What is the campaign goal in one sentence? (e.g. launch product X for clinics)"
        porque: "It gives the campaign slug and the north for copy and art direction."
      slug:
        tipo: texto
        obrigatorio: false
        pergunta: "Short campaign name for folders and files? (optional; derived from the goal)"
        porque: "Controls the name of campaigns/<brand>-<slug>/ and the piece naming."
      oferta:
        tipo: texto
        obrigatorio: false
        pergunta: "What is the offer or central message? (e.g. 30 days free, enrollment open)"
        porque: "It becomes the kicker on pieces; without an offer the copy is just the hook."
      cta:
        tipo: texto
        obrigatorio: true
        pergunta: "What is the call-to-action? (e.g. Book a demo, Enroll now)"
        porque: "Every template has a button/CTA; without declared text there is nothing to draw."
      canais:
        tipo: lista
        obrigatorio: true
        pergunta: "Where does the campaign run? (meta, google, linkedin, x, tiktok, youtube, print, email, web — or exact formats like meta_story)"
        porque: "A channel expands into a bundle of aspect ratios; safe zones depend on it."
        valores: [meta, google, linkedin, x, tiktok, youtube, print, email, web, social_paid]
      eixos:
        tipo: mapa_listas
        obrigatorio: false
        pergunta: "Does the campaign vary by axes? (e.g. product: [A, B], region: [SP, RJ], audience: [junior, senior])"
        porque: "The cartesian product of the axes multiplies the pieces; each combo can have its own photo and copy."
      conceitos:
        tipo: lista
        obrigatorio: true
        pergunta: "How many visual directions (concepts) do you want? List the names — e.g. clean, editorial, cinema."
        porque: "Each concept becomes a template, a delivery folder and a review filter."
      copy:
        tipo: copy_por_conceito
        obrigatorio: true
        pergunta: "What is the hook for each concept? May include a kicker. (e.g. clean: {hook: Less phone tag. More [care].})"
        porque: "Without copy.hook per concept the render skips the concept — text is a brand decision, not the engine's."

  video:
    titulo: "Video (optional — only if the campaign has video pieces)"
    campos:
      fonte:
        tipo: arquivo
        obrigatorio: false
        pergunta: "Which source video should I edit? (file path; concat lists several)"
        porque: "Trim, subject-aware reframe and brand overlay come from this local file."
      concat:
        tipo: lista_arquivos
        obrigatorio: false
        pergunta: "Multiple clips to splice into one master? List them in order."
        porque: "The local concat becomes the single source before cutting per format."
      duracoes:
        tipo: mapa_duracoes
        obrigatorio: false
        pergunta: "Duration per format in seconds? (e.g. meta_story: 15, default: 6)"
        porque: "Each placement has its own length; without a declaration I use the kit default."
      legendas:
        tipo: enum
        obrigatorio: false
        padrao: "off"
        valores: [auto, manual, off]
        pergunta: "Burned-in captions: auto (I transcribe locally), manual (you provide the segments) or off?"
        porque: "Auto downloads the whisper model on first use; manual needs segments with start/end/text."
      segmentos:
        tipo: lista_segmentos
        obrigatorio: false
        pergunta: "If captions=manual, what are the segments? ({start: s, end: s, text: ...})"
        porque: "Manual captions need the time windows; I do not invent spoken text."
      formatos:
        tipo: lista
        obrigatorio: false
        pergunta: "Which video formats? (optional; default: story, feed and thumbnail of the main placements)"
        porque: "Restricts the video matrix without touching the image formats."

  assets:
    titulo: "Assets"
    campos:
      fotos:
        tipo: lista_arquivos
        obrigatorio: false
        perguntar_se_ausente: true
        pergunta: "Do you have your own photos for the pieces? List the files."
        porque: "Your own photo avoids paid generation; without it images come from the provider (I show ≈ credits first)."
      videos:
        tipo: lista_arquivos
        obrigatorio: false
        pergunta: "Do you have your own video clips? List the files."
        porque: "Local clips are edited by the kit (trim/reframe/overlay/captions) with no generation cost."
      refs:
        tipo: lista_arquivos
        obrigatorio: false
        perguntar_se_ausente: true
        pergunta: "Which images are art-direction references? (they do not go into the piece, they guide the plan)"
        porque: "The design follows this campaign's briefing and references, not another brand's library."
      direitos_uso:
        tipo: texto
        obrigatorio: false
        pergunta: "What are the usage rights of the assets? (e.g. paid stock, own photo, provider generation)"
        porque: "Provenance record for the end client; the kit does not verify licenses by itself."

  compliance:
    titulo: "Compliance"
    campos:
      disclaimer:
        tipo: texto
        obrigatorio: false
        pergunta: "Is there a mandatory disclaimer on every piece? (exact text)"
        porque: "It becomes an executable check: a piece without the text is blocked before review."
      cores_proibidas:
        tipo: lista_hex
        obrigatorio: false
        pergunta: "Are there forbidden colors? (#RRGGBB)"
        porque: "It becomes a minimum-area check per forbidden color in the render."
      nobreak:
        tipo: lista
        obrigatorio: false
        pergunta: "Are there terms that cannot break lines? (e.g. product name, 'CDI College')"
        porque: "The renderer protects the term; the check confirms it is present in the copy."
      tolerancia_rosto:
        tipo: numero
        obrigatorio: false
        padrao: 0.02
        pergunta: "Text/logo overlap tolerance on the face (0–1)? (default 0.02)"
        porque: "Unbreakable rule: never cover faces; the tolerance calibrates the block."

  provider:
    titulo: "Generation provider (AI image/video)"
    campos:
      nome:
        tipo: enum
        obrigatorio: false
        padrao: manual
        valores: [manual, magnific-mcp, http]
        pergunta: "How should missing assets be generated? manual (you drop the files), magnific-mcp (agent via MCP) or http (API)?"
        porque: "Defines the generation contract; the ≈ credits notice appears before any job."
      creditos_imagem:
        tipo: numero
        obrigatorio: false
        padrao: 0
        pergunta: "How many credits per generated image? (for the cost notice)"
        porque: "The notice is informational, not blocking — but it needs the right number."
      creditos_video:
        tipo: numero
        obrigatorio: false
        padrao: 0
        pergunta: "How many credits per generated video?"
        porque: "Video is a provider job, not local render; the cost is per clip."
      drop_dir:
        tipo: texto
        obrigatorio: false
        padrao: "~/Downloads"
        pergunta: "Where do you drop the generated files (manual/MCP)? (default ~/Downloads)"
        porque: "The kit matches the file by the job prefix in this folder."
      api_url:
        tipo: texto
        obrigatorio: false
        pergunta: "If provider=http, what is the API URL?"
        porque: "Without a URL there is no HTTP contract; the key lives in an environment variable, never in the file."
      api_key_env:
        tipo: texto
        obrigatorio: false
        pergunta: "If provider=http, which environment variable holds the key? (e.g. MAGNIFIC_API_KEY)"
        porque: "Secrets never go into the briefing or brand.yaml."